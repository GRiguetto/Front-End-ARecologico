<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar - AR Ecológico</title>
  <link rel="stylesheet" href="./static/css/style.css">
</head>
<body data-publica>
  <main class="pagina-login">
    <section class="secao login">
    <h1 class="marca-logo" role="img" aria-label="AR Ecológico"></h1>
    <p class="subtitulo">Entre para acessar o sistema de gestão.</p>
      <form id="formularioLogin">
        <label>E-mail<input type="email" name="email" autocomplete="username" required autofocus></label>
        <label>Senha<input type="password" name="senha" autocomplete="current-password" required></label>
        <p id="mensagemLogin" class="erro" role="alert"></p>
        <button type="submit">Entrar</button>
      </form>
      <p id="dicaTeste" class="dica">Usuário de teste: <b>admin@arecologico.com</b><br>Senha: <b>123456</b></p>
    </section>
  </main>
  <script src="./static/js/config.js"></script>
  <script src="./static/js/autenticacao.js"></script>
</body>
</html>
